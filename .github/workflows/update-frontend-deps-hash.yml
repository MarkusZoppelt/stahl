name: Update frontendDepsHash

on:
  pull_request_target:
    paths:
      - frontend/package.json
      - frontend/pnpm-lock.yaml

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true

      - name: Ensure hash script from base
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          mkdir -p scripts
          git show "origin/${{ github.base_ref }}:scripts/update-frontend-deps-hash.sh" \
            > scripts/update-frontend-deps-hash.sh
          chmod +x scripts/update-frontend-deps-hash.sh

      - run: ./scripts/update-frontend-deps-hash.sh

      - run: |
          git diff --quiet flake.nix && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "chore(nix): update frontendDepsHash"
          git push

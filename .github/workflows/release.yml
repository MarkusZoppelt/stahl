name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  # Build the installers when something they depend on changes. Nothing is published.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
      - assets/icons/**

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
          - platform: ubuntu-latest
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev

      # rustup reads the version from rust-toolchain.toml.
      - name: install the Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: install cargo-bundle
        if: matrix.platform != 'windows-latest'
        run: cargo install cargo-bundle --locked

      - name: build the macOS disk image
        if: matrix.platform == 'macos-latest'
        run: |
          cargo bundle --release
          app="target/release/bundle/osx/Stahl Capital.app"
          codesign --force --deep --sign - "$app"
          hdiutil create -volname "Stahl Capital" -srcfolder "$app" -ov -format UDZO stahl-capital-macos-arm64.dmg

      - name: build the Debian package
        if: matrix.platform == 'ubuntu-latest'
        run: |
          cargo bundle --release --format deb
          cp target/release/bundle/deb/*.deb .

      - name: build the Windows archive
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --release
          Compress-Archive -Path target/release/stahl.exe -DestinationPath stahl-capital-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform }}
          path: |
            *.dmg
            *.deb
            *.zip
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          name: "Stahl Capital ${{ github.ref_name }}"
          body: "See the assets below to download and install."
          draft: true
          files: |
            *.dmg
            *.deb
            *.zip

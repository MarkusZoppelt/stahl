[package]
name = "stahl-ios"
version = "0.0.0"
description = "Stahl Capital on iOS: the app's runtime on a CAMetalLayer, for the Swift shell"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
portfolio_rs = "0.10.1"
rune = { git = "https://github.com/anomalyco/rune", rev = "2bdfae16568782a56cb93818944d05b93546bce5" }
stahl = { path = "../.." }
tokio = { version = "1", features = ["rt-multi-thread"] }
# `stahl`'s compositor builds its shader door with Rune's own wgpu, at the same version.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "metal"] }

# Its own workspace, so the desktop build and its lockfile don't see it.
[workspace]

[profile.release]
lto = true
codegen-units = 1

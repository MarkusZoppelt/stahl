[package]
name = "stahl-ios"
version = "0.0.0"
description = "Stahl Capital on iOS: the app's runtime on a CAMetalLayer, for the Swift shell"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
portfolio_rs = "0.10.1"
rune = { git = "https://github.com/anomalyco/rune", rev = "bca47138e9c31a7870a79272ee2523b592b1248d" }
stahl = { path = "../.." }
tokio = { version = "1", features = ["rt-multi-thread"] }

# Its own workspace, so the desktop build and its lockfile don't see it.
[workspace]

[profile.release]
lto = true
codegen-units = 1

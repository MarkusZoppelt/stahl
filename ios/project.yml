# The Xcode project, generated by ios/install-device.sh: Xcode is only here to sign for a device.
name: Stahl
options:
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
targets:
  Stahl:
    type: application
    platform: iOS
    sources:
      - Shell
      - path: ../assets/door.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STAHL_BUNDLE_ID)
        INFOPLIST_FILE: Shell/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Shell/stahl.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        ENABLE_DEBUG_DYLIB: NO
        LIBRARY_SEARCH_PATHS: $(STAHL_RUST_LIB)
        OTHER_LDFLAGS: >-
          -lstahl_ios -liconv -lobjc -framework Security -framework QuartzCore
          -framework CoreGraphics -framework Metal -framework Foundation
          -framework CoreFoundation -framework UIKit -framework LocalAuthentication
